name: Import project ZIP
on:
  push:
    branches: [main]
    paths:
      - "palworld-breeding-calculator.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Extract project into repository root
        run: |
          set -euo pipefail
          test -f palworld-breeding-calculator.zip
          unzip -o palworld-breeding-calculator.zip
          if [ -d palworld-breeding-calculator ]; then
            cp -a palworld-breeding-calculator/. .
            rm -rf palworld-breeding-calculator
          fi
          rm palworld-breeding-calculator.zip
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Palworld breeding calculator project"
          git push
